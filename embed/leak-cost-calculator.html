<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leak Cost Calculator</title>
    <meta name="robots" content="noindex">
<link rel="canonical" href="https://buenaparkleakrepairpros.com/embed/leak-cost-calculator">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;padding:1rem;background:transparent}
:root{--accent:#F59E0B;--hero-deep:#042F2E;--border:#ccc}
.rate-notice{background:#fff3cd;border:1px solid #ffc107;border-radius:6px;padding:.75rem;margin-bottom:1.25rem;font-size:.83rem;color:#856404}
.input-row{margin-bottom:1rem}
.input-row label{display:block;font-weight:600;font-size:.88rem;margin-bottom:.35rem}
.input-row input{width:100%;padding:.55rem .8rem;border:1px solid var(--border);border-radius:5px;font-size:.95rem}
.units-btn-group{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem}
.units-btn{padding:.4rem .9rem;border:2px solid var(--accent);border-radius:5px;background:#fff;font-weight:700;cursor:pointer;font-size:.83rem}
.units-btn.active{background:var(--accent);color:#fff}
.preset-btn{padding:.38rem .8rem;border:2px solid #ddd;border-radius:5px;background:#fff;cursor:pointer;font-size:.82rem;margin:.2rem .2rem .2rem 0}
.preset-btn.active,.preset-btn:hover{border-color:var(--accent);background:var(--accent);color:#fff}
.calc-btn{width:100%;padding:.7rem;background:var(--hero-deep);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:700;font-size:1rem;margin-top:.5rem}
.result{background:#f5f5f5;border-radius:8px;padding:1rem;margin-top:1rem;display:none}
.result.show{display:block}
.result-big{font-size:1.5rem;font-weight:900;color:var(--hero-deep);margin-bottom:.5rem}
.result-row{display:flex;justify-content:space-between;font-size:.88rem;padding:.3rem 0;border-bottom:1px solid #e0e0e0}
.result-row:last-of-type{border-bottom:none}
.result-value{font-weight:700}
.hint{font-size:.78rem;color:#666;margin-top:.2rem}
.foot{text-align:center;font-size:.75rem;color:#888;margin-top:1.25rem}
.foot a{color:var(--hero-deep)}
</style>
</head>
<body>
<div class="rate-notice">Rate estimates — <a href="https://www.buenapark.com/city_departments/public_works/utilities/water/water_rates.php" target="_blank">verify at buenapark.com</a></div>

<div class="input-row">
  <label>Leak type</label>
  <div class="units-btn-group">
    <button class="units-btn active" id="e-faucet">Faucet</button>
    <button class="units-btn" id="e-toilet">Toilet</button>
    <button class="units-btn" id="e-trickle">Trickle</button>
    <button class="units-btn" id="e-irr">Sprinkler</button>
  </div>
</div>

<div id="e-faucet-in">
  <div class="input-row">
    <label>Drips per minute</label>
    <div>
      <button class="preset-btn" id="e-s10">Slow 10</button>
      <button class="preset-btn active" id="e-s60">Steady 60</button>
      <button class="preset-btn" id="e-s120">Fast 120</button>
    </div>
    <input type="number" id="e-dpm" value="60" min="1" max="600" style="margin-top:.4rem">
  </div>
</div>
<div id="e-toilet-in" style="display:none">
  <div class="input-row"><label>Gallons per day</label><input type="number" id="e-t-gpd" value="480" min="1"></div>
</div>
<div id="e-trickle-in" style="display:none">
  <div class="input-row"><label>Gallons per hour</label><input type="number" id="e-tri-gph" value="5" min="0.1" step="0.1"></div>
</div>
<div id="e-irr-in" style="display:none">
  <div class="input-row"><label>Gallons per hour</label><input type="number" id="e-irr-gph" value="60" min="0.1" step="0.1"></div>
</div>

<div class="input-row">
  <label>Number of leaking fixtures</label>
  <input type="number" id="e-count" value="1" min="1" max="20">
</div>

<button class="calc-btn" id="e-calc">Calculate Leak Cost</button>

<div class="result" id="e-result">
  <div class="result-big" id="e-gpd-big"></div>
  <div class="result-row"><span>Monthly water cost (est.)</span><span class="result-value" id="e-mo"></span></div>
  <div class="result-row"><span>Annual water cost (est.)</span><span class="result-value" id="e-yr"></span></div>
  <div class="result-row"><span>Gallons per month</span><span class="result-value" id="e-gpm"></span></div>
</div>

<div class="foot">
  <a href="https://buenaparkleakrepairpros.com" target="_blank">Powered by Buena Park Leak Repair Experts</a>
</div>

<script>
(function(){
  var lt="faucet";
  function btn(id){return document.getElementById(id);}
  function val(id){return parseFloat(document.getElementById(id).value)||0;}
  function show(id){document.getElementById(id).style.display="block";}
  function hide(id){document.getElementById(id).style.display="none";}
  function setType(t){
    lt=t;
    ["faucet","toilet","trickle","irr"].forEach(function(x){
      btn("e-"+x).classList.toggle("active",x===t);
      hide("e-"+x+"-in");
    });
    show("e-"+t+"-in");
  }
  btn("e-faucet").addEventListener("click",function(){setType("faucet");});
  btn("e-toilet").addEventListener("click",function(){setType("toilet");});
  btn("e-trickle").addEventListener("click",function(){setType("trickle");});
  btn("e-irr").addEventListener("click",function(){setType("irr");});
  function setDPM(n,id){
    btn("e-dpm").value=n;
    ["e-s10","e-s60","e-s120"].forEach(function(x){btn(x).classList.toggle("active",x===id);});
  }
  btn("e-s10").addEventListener("click",function(){setDPM(10,"e-s10");});
  btn("e-s60").addEventListener("click",function(){setDPM(60,"e-s60");});
  btn("e-s120").addEventListener("click",function(){setDPM(120,"e-s120");});
  btn("e-calc").addEventListener("click",function(){
    var gpd=0;
    if(lt==="faucet")gpd=(val("e-dpm")*60*24)/15140;
    else if(lt==="toilet")gpd=val("e-t-gpd");
    else if(lt==="trickle")gpd=val("e-tri-gph")*24;
    else gpd=val("e-irr-gph")*24;
    gpd*=(val("e-count")||1);
    if(gpd<=0)return;
    var gpm=gpd*30.44;
    var hcf=gpm/748;
    var cost=hcf*4.235;
    var fmt=function(n){return n.toLocaleString("en-US",{maximumFractionDigits:n>=100?0:1});};
    btn("e-gpd-big").textContent=fmt(gpd)+" gallons per day";
    btn("e-mo").textContent="$"+cost.toFixed(2)+"/month";
    btn("e-yr").textContent="$"+(cost*12).toFixed(2)+"/year";
    btn("e-gpm").textContent=fmt(gpm)+" gal/month";
    btn("e-result").classList.add("show");
  });
})();
</script>
</body>
</html>
